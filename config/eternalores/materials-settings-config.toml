#Eternal Ores Material Config.
#
# This config allows you to Enable or Disable Eternal Ores material sets. These sets can be
# disabled individually, or entirely.
#
# This config DOES NOT unregister any of these material sets in any way, it only hides them and toggles any function they had, if they have one.
#
# Each change requires a Game Restart.
#
